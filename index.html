<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拼多多商品批量打开</title>
<style>
  :root { color-scheme: light; font-family: system-ui, "Microsoft YaHei", sans-serif; }
  body { margin: 0; background: #f5f7fa; color: #172033; }
  main { max-width: 760px; margin: 40px auto; padding: 28px; background: #fff; border-radius: 16px; box-shadow: 0 8px 30px #16233a12; }
  h1 { margin: 0 0 8px; font-size: 24px; }
  p { color: #596579; line-height: 1.6; }
  textarea { box-sizing: border-box; width: 100%; min-height: 190px; padding: 14px; border: 1px solid #cbd3df; border-radius: 10px; font: 15px/1.7 ui-monospace, Consolas, monospace; resize: vertical; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  button { border: 0; border-radius: 9px; padding: 11px 18px; font-size: 15px; cursor: pointer; }
  #open { color: white; background: #e02e24; }
  #clear { color: #29364a; background: #e9edf3; }
  #status { min-height: 24px; margin: 14px 0 4px; color: #46546a; }
  #links { display: grid; gap: 8px; margin-top: 12px; }
  #links a { color: #1769c2; overflow-wrap: anywhere; }
  .note { font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>拼多多商品批量打开</h1>
  <p>每行一个商品 ID，也可以用逗号、空格或顿号分隔。点击按钮后会为每个商品打开一个标签页。</p>
  <textarea id="ids" aria-label="商品ID列表"></textarea>
  <div class="actions">
    <button id="open">打开全部商品</button>
    <button id="clear">清空</button>
  </div>
  <div id="status" aria-live="polite"></div>
  <div id="links"></div>
  <p class="note">如果浏览器拦截了批量弹出的标签页，请允许此页面打开弹窗；下面也会列出逐个打开的商品链接。</p>
</main>
<script>
const input = document.getElementById('ids');
const status = document.getElementById('status');
const links = document.getElementById('links');
document.getElementById('clear').addEventListener('click', () => {
  input.value = '';
  status.textContent = '';
  links.replaceChildren();
});
document.getElementById('open').addEventListener('click', () => {
  const ids = [...new Set((input.value.match(/\d+/g) || []).filter(id => id.length >= 8))];
  links.replaceChildren();
  if (!ids.length) {
    status.textContent = '没有识别到商品 ID。';
    return;
  }
  status.textContent = '正在打开 ' + ids.length + ' 个商品页面。若有标签页被拦截，可点击下方链接逐个打开。';
  for (const id of ids) {
    const url = 'https://mobile.yangkeduo.com/goods.html?goods_id=' + id;
    const a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = id + '  —  打开商品';
    links.appendChild(a);
    window.open(url, '_blank', 'noopener,noreferrer');
  }
});
</script>
</body>
</html>
